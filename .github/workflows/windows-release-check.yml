name: Windows release check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Windows/**'
      - '.github/workflows/windows-release-check.yml'
  push:
    branches: [main]
    paths:
      - 'Windows/**'
      - '.github/workflows/windows-release-check.yml'

jobs:
  test-and-build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm install --global pnpm@10.17.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test uninstall planning
        run: pnpm test
      - name: Build Windows installer
        run: pnpm run build:win
      - name: Upload checked installer
        uses: actions/upload-artifact@v4
        with:
          name: Pluck-Windows-x64
          path: Windows/dist/GoodTools-Installer-Pluck-Windows-x64.exe
          if-no-files-found: error
